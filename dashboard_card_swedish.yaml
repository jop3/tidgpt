# ============================================
# Swedish Dashboard Card with OpenAI TTS
# ============================================
# Manual control buttons for time announcements in Swedish
# Add this to your Home Assistant dashboard
#
# HOW TO ADD:
# 1. Go to your Home Assistant dashboard
# 2. Click the three dots → Edit Dashboard
# 3. Click Add Card → Manual
# 4. Paste this YAML
# 5. Replace media_player.living_room_speaker with your speaker
# ============================================

type: vertical-stack
cards:
  - type: markdown
    content: |
      ## ⏰ Tidspåminnelser
      Snabba meddelanden för barnen

  - type: horizontal-stack
    cards:
      - type: button
        name: Säg klockan
        icon: mdi:clock-outline
        tap_action:
          action: call-service
          service: script.announce_time_and_countdown_swedish
          service_data:
            speaker: media_player.living_room_speaker
            target_time: "08:00"
            announce_current_time: true

      - type: button
        name: 30 min varning
        icon: mdi:clock-alert-outline
        tap_action:
          action: call-service
          service: tts.openai_say
          service_data:
            entity_id: media_player.living_room_speaker
            message: "30 minuter kvar tills vi måste gå!"

  - type: horizontal-stack
    cards:
      - type: button
        name: 15 min varning
        icon: mdi:clock-fast
        tap_action:
          action: call-service
          service: tts.openai_say
          service_data:
            entity_id: media_player.living_room_speaker
            message: "15 minuter kvar tills vi måste gå!"

      - type: button
        name: 5 min varning
        icon: mdi:alarm-light
        tap_action:
          action: call-service
          service: tts.openai_say
          service_data:
            entity_id: media_player.living_room_speaker
            message: "Bara 5 minuter kvar! Dags att göra klart!"

  - type: horizontal-stack
    cards:
      - type: button
        name: Borsta tänderna
        icon: mdi:tooth-outline
        tap_action:
          action: call-service
          service: tts.openai_say
          service_data:
            entity_id: media_player.living_room_speaker
            message: "Glöm inte att borsta tänderna!"

      - type: button
        name: Ta skolväskan
        icon: mdi:bag-personal-outline
        tap_action:
          action: call-service
          service: tts.openai_say
          service_data:
            entity_id: media_player.living_room_speaker
            message: "Dags att ta din skolväska och dina skor!"

  - type: horizontal-stack
    cards:
      - type: button
        name: Frukost
        icon: mdi:food-apple-outline
        tap_action:
          action: call-service
          service: tts.openai_say
          service_data:
            entity_id: media_player.living_room_speaker
            message: "Dags för frukost!"

      - type: button
        name: God morgon
        icon: mdi:weather-sunny
        tap_action:
          action: call-service
          service: tts.openai_say
          service_data:
            entity_id: media_player.living_room_speaker
            message: "God morgon! Dags att vakna och börja dagen!"

# ============================================
# Röstval (Voice Selection)
# ============================================
# Add this dropdown to easily test different voices
# Requires input_select helper (see below)

# First, add this to configuration.yaml:
# input_select:
#   tts_voice:
#     name: OpenAI TTS Röst
#     options:
#       - alloy
#       - echo
#       - fable
#       - nova
#       - onyx
#       - shimmer
#     initial: nova
#     icon: mdi:account-voice

# Then add this card to your dashboard:
# type: entities
# entities:
#   - entity: input_select.tts_voice
#     name: Välj röst
# title: TTS Inställningar

# And in your configuration.yaml tts section, use:
# voice: "{{ states('input_select.tts_voice') }}"

