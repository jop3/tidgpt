# title: Morning Reminder Schedule

# ============================================
# Advanced: Input Select for Target Time
# ============================================
# If you want to easily change the target time:
#
# 1. Add to configuration.yaml:
# input_select:
#   morning_target_time:
#     name: Target Departure Time
#     options:
#       - "07:30"
#       - "08:00"
#       - "08:30"
#     initial: "08:00"
#     icon: mdi:clock-outline
#
# 2. In your automations, use:
#   target_time: "{{ states('input_select.morning_target_time') }}"
#
# 3. Add to dashboard:
# type: entities
# entities:
#   - entity: input_select.morning_target_time
# title: Set Departure Time
